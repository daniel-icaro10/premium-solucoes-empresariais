services:
  - type: web
    name: premium-solucoes-empresariais
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # SPA: todas as rotas (/servicos, /configuracoes...) devolvem o index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Segurança básica: impede o site de ser embutido em outros sites e o "sniffing" de tipos.
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Arquivos do build têm hash no nome: podem ficar em cache por 1 ano.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

services:
  - type: web
    name: premium-solucoes-empresariais
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # SPA: todas as rotas (/servicos, /configuracoes...) devolvem o index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
